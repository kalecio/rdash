name: rdash
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rdash
      POSTGRES_USER: rdash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rdash -d rdash']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Defina PAYLOAD_SECRET no .env}
      DATABASE_URL: postgresql://rdash:${POSTGRES_PASSWORD}@db:5432/rdash
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      MEDIA_DIR: /app/media
      HOSTNAME: 0.0.0.0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', '-c', 'node node_modules/payload/bin.js migrate && node node_modules/next/dist/bin/next start --hostname 0.0.0.0']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
  storybook:
    profiles: ['tools']
    build: .
    ports:
      - '127.0.0.1:6006:6006'
    environment:
      STORYBOOK_DISABLE_TELEMETRY: '1'
      NODE_ENV: development
    command: ['node', 'node_modules/storybook/dist/bin/dispatcher.js', 'dev', '--port', '6006', '--host', '0.0.0.0', '--no-open', '--ci', '--disable-telemetry']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:6006/index.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
volumes:
  postgres_data:
  media_data:
